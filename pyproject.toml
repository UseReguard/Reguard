[project]
name = "Reguard"
version = "0.1.0"
description = "Deterministic runtime compliance checks for AI agents"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Optional for PostgreSQL:
pgvector = [
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
]
yaml = ["PyYAML>=6.0"]
pdf = ["pypdf>=4.0"]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["compliance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
# Fixtures are repositories-under-test, NOT pytest test modules.
norecursedirs = ["tests/runtime/fixtures"]