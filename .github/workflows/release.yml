# Reguard Core release workflow
#
# Trigger: push of a tag matching `v<major>.<minor>.<patch>` or
# `v<major>.<minor>.<patch>-rc.<number>` to UseReguard/Reguard.
#
# Stages (each is a separate job; cross-job metadata propagates
# only through job outputs declared in this file, never via
# environment variables):
#
#   validate     — strict tag-shape parsing; tag == pyproject version
#   build        — clean-runner setup; tests; build wheel+sdist;
#                  upload artifacts + SHA256SUMS
#   publish-pypi — Trusted Publishing (OIDC); downloads build artifacts
#   publish-runtime — push runtime image to GHCR (GITHUB_TOKEN);
#                  captures digest from action output
#   release      — create GitHub Release; attach CI artifacts
#
# No job exposes publication credentials to the target agent runtime.
# No long-lived PyPI tokens are stored in the repository.
# No `latest` tag is published for an RC.
# RC tags are immutable: once pushed, a code/workflow change requires RC2.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions: {}

env:
  PYTHON_VERSION: "3.12"

jobs:

  validate:
    name: Validate tag shape and package-version match
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      git_tag: ${{ steps.parse.outputs.git_tag }}
      package_version: ${{ steps.parse.outputs.package_version }}
      source_sha: ${{ steps.parse.outputs.source_sha }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - name: Checkout source at tag commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Strict tag parsing and version comparison
        id: parse
        shell: bash
        run: |
          set -euo pipefail

          GIT_TAG="${GITHUB_REF_NAME}"
          SOURCE_SHA="$(git rev-parse HEAD)"

          # Strict shape validation (brief §16).
          if [[ "${GIT_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            IS_PRERELEASE="false"
            EXPECTED_PKG_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          elif [[ "${GIT_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]]; then
            IS_PRERELEASE="true"
            EXPECTED_PKG_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}rc${BASH_REMATCH[4]}"
          else
            echo "::error::Tag '${GIT_TAG}' is not a recognized release tag shape."
            echo "::error::Expected: v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-rc.<number>"
            exit 1
          fi

          PKG_VERSION="$(python -c "import tomllib, pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"

          if [ "${EXPECTED_PKG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag '${GIT_TAG}' implies package version '${EXPECTED_PKG_VERSION}' but pyproject.toml declares '${PKG_VERSION}'."
            exit 1
          fi

          # Defense against tag-confusion attacks: confirm GITHUB_SHA == HEAD.
          if [ "${GITHUB_SHA}" != "${SOURCE_SHA}" ]; then
            echo "::error::GITHUB_SHA (${GITHUB_SHA}) does not match git rev-parse HEAD (${SOURCE_SHA})."
            exit 1
          fi

          echo "git_tag=${GIT_TAG}"            >> "$GITHUB_OUTPUT"
          echo "package_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}"      >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

          {
            echo "## Release validation"
            echo
            echo "- Git tag:        \`${GIT_TAG}\`"
            echo "- Package version:\`${PKG_VERSION}\`"
            echo "- Source SHA:     \`${SOURCE_SHA}\`"
            echo "- Pre-release:    ${IS_PRERELEASE}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Test and build exact artifacts
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      git_tag: ${{ steps.parse.outputs.git_tag }}
      package_version: ${{ steps.parse.outputs.package_version }}
      wheel_sha256: ${{ steps.meta.outputs.wheel_sha }}
      sdist_sha256: ${{ steps.meta.outputs.sdist_sha }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
    steps:
      - name: Checkout source at tag commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project and dev dependencies (clean runner)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip>=23" "build>=1.0" "twine>=5" "pytest>=8"
          python -m pip install -e ".[dev]"

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          pytest tests/ -q

      - name: Build wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist src/*.egg-info src/compliance.egg-info
          python -m build --sdist --wheel

      - name: twine check
        shell: bash
        run: |
          set -euo pipefail
          python -m twine check dist/*

      - name: Re-parse tag and record authoritative hashes
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          echo "git_tag=${{ needs.validate.outputs.git_tag }}"             >> "$GITHUB_OUTPUT"
          echo "package_version=${{ needs.validate.outputs.package_version }}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${{ needs.validate.outputs.is_prerelease }}" >> "$GITHUB_OUTPUT"

      - name: Record source SHA and authoritative artifact hashes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "${SOURCE_SHA}" != "${{ needs.validate.outputs.source_sha }}" ]; then
            echo "::error::Local HEAD (${SOURCE_SHA}) drifted from validate.outputs.source_sha (${{ needs.validate.outputs.source_sha }})."
            exit 1
          fi

          WHL_FILE="$(ls dist/*.whl | head -n1)"
          SDIST_FILE="$(ls dist/*.tar.gz | head -n1)"

          WHL_SHA="$(sha256sum "${WHL_FILE}" | awk '{print $1}')"
          SDIST_SHA="$(sha256sum "${SDIST_FILE}" | awk '{print $1}')"

          WHL_SIZE="$(stat -c '%s' "${WHL_FILE}")"
          SDIST_SIZE="$(stat -c '%s' "${SDIST_FILE}")"

          {
            printf '%s  %s\n' "${WHL_SHA}"   "$(basename "${WHL_FILE}")"
            printf '%s  %s\n' "${SDIST_SHA}" "$(basename "${SDIST_FILE}")"
          } > dist/SHA256SUMS
          # Verify the SHA256SUMS file itself.
          ( cd dist && sha256sum -c SHA256SUMS )

          echo "source_sha=${SOURCE_SHA}"     >> "$GITHUB_OUTPUT"
          echo "wheel_sha=${WHL_SHA}"         >> "$GITHUB_OUTPUT"
          echo "sdist_sha=${SDIST_SHA}"       >> "$GITHUB_OUTPUT"
          echo "wheel_file=${WHL_FILE}"       >> "$GITHUB_OUTPUT"
          echo "sdist_file=${SDIST_FILE}"     >> "$GITHUB_OUTPUT"
          echo "wheel_size=${WHL_SIZE}"       >> "$GITHUB_OUTPUT"
          echo "sdist_size=${SDIST_SIZE}"     >> "$GITHUB_OUTPUT"

          {
            echo "## Build artifacts"
            echo
            echo "- Wheel:    \`$(basename "${WHL_FILE}")\`  (${WHL_SIZE} bytes)"
            echo "  - SHA256: \`${WHL_SHA}\`"
            echo "- Sdist:    \`$(basename "${SDIST_FILE}")\`  (${SDIST_SIZE} bytes)"
            echo "  - SHA256: \`${SDIST_SHA}\`"
            echo "- SHA256SUMS: \`dist/SHA256SUMS\` (verified)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts (wheel + sdist + SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: reguard-dist-${{ needs.validate.outputs.git_tag }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    name: Publish to PyPI (Trusted Publishing, OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: reguard-dist-${{ needs.build.outputs.git_tag }}
          path: dist

      - name: Verify downloaded artifacts against authoritative hashes
        shell: bash
        run: |
          set -euo pipefail
          ( cd dist && sha256sum -c SHA256SUMS )

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # skip-existing is intentionally NOT set: a duplicate publish
          # must surface as a hard failure (runbook §11, brief §12).

      - name: Record PyPI publication status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## PyPI publication"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Status:    ✅ SUCCESS"
              echo "- Project:   \`reguard\`"
              echo "- Version:   \`${{ needs.build.outputs.package_version }}\`"
              echo "- Source:    \`${{ needs.build.outputs.source_sha }}\`"
              echo "- Target:    https://pypi.org/project/reguard/${{ needs.build.outputs.package_version }}/"
            else
              echo "- Status:    ❌ FAILED"
              echo "- See job logs for the underlying error."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish-runtime:
    name: Build and push GHCR runtime image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      runtime_digest: ${{ steps.build.outputs.digest }}
      runtime_reference: ${{ steps.build.outputs.runtime_reference }}
    steps:
      - name: Checkout source at tag commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          push: true
          provenance: true
          tags: |
            ghcr.io/usereguard/reguard-runtime:${{ needs.build.outputs.package_version }}
            ghcr.io/usereguard/reguard-runtime:${{ needs.build.outputs.source_sha }}
          build-args: |
            REGUARD_SOURCE_REVISION=${{ needs.build.outputs.source_sha }}
            REGUARD_SOURCE_VERSION=${{ needs.build.outputs.package_version }}

      - name: Record GHCR publication status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## GHCR publication"
            echo
            if [ "${{ steps.build.conclusion }}" = "success" ]; then
              echo "- Status:    ✅ SUCCESS"
              echo "- Reference: \`ghcr.io/usereguard/reguard-runtime:${{ needs.build.outputs.package_version }}\`"
              echo "- SHA tag:   \`ghcr.io/usereguard/reguard-runtime:${{ needs.build.outputs.source_sha }}\`"
              echo "- Digest:    \`${{ steps.build.outputs.digest }}\`"
            else
              echo "- Status:    ❌ FAILED"
              echo "- See step logs for the underlying error."
              echo "- On a transient/config failure, rerun only this job against the same tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release with CI artifacts
    needs: [build, publish-pypi, publish-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: reguard-dist-${{ needs.build.outputs.git_tag }}
          path: dist

      - name: Checkout source for release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: notes_src

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.git_tag }}
          name: "Reguard Core ${{ needs.build.outputs.git_tag }}"
          body_path: notes_src/audit/reguard_core_v0_1_release/rc_release_notes.md
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record release status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## GitHub Release"
            echo
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Status:    ✅ SUCCESS"
              echo "- Tag:       \`${{ needs.build.outputs.git_tag }}\`"
              echo "- URL:       https://github.com/UseReguard/Reguard/releases/tag/${{ needs.build.outputs.git_tag }}"
              echo "- Attached:  wheel + sdist + SHA256SUMS"
            else
              echo "- Status:    ❌ FAILED"
              echo "- PyPI and GHCR may still have succeeded; rerun only this job against the same tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
