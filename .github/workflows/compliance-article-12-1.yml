name: compliance-article-12-1

# Workflow manually triggered. PR / push auto-runs are NOT enabled
# at this stage. See audit/article_12_1_pipeline_report.md for the
# reproducibility contract.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "target repository (owner/name)"
        required: true
        default: "SWE-agent/mini-swe-agent"
        type: string
      sha:
        description: "exact commit SHA to check out"
        required: true
        default: "25941c89cfbc91eb40b3f8756348c91d9977d57e"
        type: string
      executor:
        description: "execution backend; must be 'subprocess' or 'container'"
        required: false
        default: "container"
        type: choice
        options:
          - subprocess
          - container

# Strictly read-only. The probe must never be granted write
# permissions against the host repo. The container step additionally
# needs no OCI-runtime privileges beyond what `docker run` already
# needs (the runner provides Docker by default).
permissions:
  contents: read

jobs:
  article-12-1:
    name: EU AI Act Article 12(1) compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Reguard
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: Reguard
          fetch-depth: 0

      - name: Checkout target repository at exact SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          path: target
          fetch-depth: 0

      - name: Build runtime container image
        if: ${{ inputs.executor == 'container' }}
        working-directory: Reguard
        # GitHub Actions runners ship Docker, not podman. The runner
        # already has Docker installed and running on a daemon
        # socket the job can reach. Building on the runner keeps
        # the image identical to what the tool would build locally.
        run: |
          docker build \
            --tag python-agent-runtime:dev \
            --label "reguard.runtime.image=python-agent-runtime:dev" \
            --label "reguard.runtime.executor=container" \
            -f runtime/Dockerfile \
            .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Reguard
        working-directory: Reguard
        run: |
          python -m pip install --upgrade pip
          # The tool is currently source-tree only. We don't pip-install
          # itself; we add the src/ directory to PYTHONPATH for the run.
          echo "PYTHONPATH=$PYTHONPATH:$GITHUB_WORKSPACE/Reguard/src" >> $GITHUB_ENV

      - name: Run Article 12(1) check
        working-directory: Reguard
        env:
          PYTHONUNBUFFERED: "1"
          # no LLM creds; the adapters use deterministic stubs
          REGUARD_RUNTIME_IMAGE: python-agent-runtime:dev
          # GitHub Actions runner image store: docker. The runner
          # builds the image with `docker build` and the runner's
          # rootless podman has a separate store that would attempt
          # to pull from registries instead of seeing the local
          # build. Pinning docker keeps local + GHA on the same
          # store when locally that store happens to be podman.
          REGUARD_RUNTIME_BINARY: docker
        run: |
          set -uo pipefail
          set +e
          python scripts/compliance-check.py \
            --repo "${{ inputs.repository }}" \
            --sha "${{ inputs.sha }}" \
            --repo-path "$GITHUB_WORKSPACE/target" \
            --requirement AI_ACT_12_1_AUTOMATIC_EVENT_LOGGING \
            --executor "${{ inputs.executor }}" \
            --output compliance-result.json
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Write job summary
        if: always()
        working-directory: Reguard
        env:
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          {
            echo "## EU AI Act Article 12(1) compliance"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            if [ -f compliance-result.json ]; then
              REPO=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['repository'])")
              SHA=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['sha'])")
              REQ=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['requirement_id'])")
              STATUS=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['status'])")
              ADAPTER=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['adapter_name'])")
              ADAPTER_V=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['adapter_version'])")
              REQ_V=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['requirement_version'])")
              RT_V=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['runtime_version'])")
              EVT=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['event_count'])")
              ORIGINS=$(python -c "import json,sys; print(', '.join(json.load(open('compliance-result.json'))['evidence_origins']))")
              DUR=$(python -c "import json,sys; print(json.load(open('compliance-result.json'))['duration_seconds'])")
              echo "| Repository | $REPO |"
              echo "| SHA | $SHA |"
              echo "| Requirement | $REQ |"
              echo "| Status | $STATUS |"
              echo "| Adapter | $ADAPTER |"
              echo "| Adapter version | $ADAPTER_V |"
              echo "| Requirement version | $REQ_V |"
              echo "| Runtime version | $RT_V |"
              echo "| Event count | $EVT |"
              echo "| Evidence origins | $ORIGINS |"
              echo "| Duration (s) | $DUR |"
              echo "| Executor | ${{ inputs.executor }} |"
            else
              echo "| Repository | $INPUT_REPOSITORY |"
              echo "| SHA | $INPUT_SHA |"
              echo "| Status | UNKNOWN |"
              echo "| (compliance-result.json missing) | |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute slug-safe artifact name
        if: always()
        id: slug
        run: |
          SLUG_REPO=$(echo "${{ inputs.repository }}" | tr '/' '-')
          SHORT_SHA=$(echo "${{ inputs.sha }}" | cut -c1-12)
          echo "slug_repo=${SLUG_REPO}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload compliance-result.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-12-1-${{ steps.slug.outputs.slug_repo }}-${{ steps.slug.outputs.short_sha }}
          path: Reguard/compliance-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-12-1-evidence-${{ steps.slug.outputs.slug_repo }}-${{ steps.slug.outputs.short_sha }}
          path: Reguard/evidence
          if-no-files-found: ignore
          retention-days: 30